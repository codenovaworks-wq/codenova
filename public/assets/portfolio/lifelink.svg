<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lifelink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="red_pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_lifelink)" rx="12" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Dashboard Card Frame -->
  <rect x="80" y="60" width="640" height="380" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="40" rx="10" fill="#0F172A" />
  <circle cx="106" cy="80" r="5" fill="#EF4444" />
  <circle cx="122" cy="80" r="5" fill="#F59E0B" />
  <circle cx="138" cy="80" r="5" fill="#10B981" />
  <text x="170" y="85" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">LifeLink Dispatch System · Live Dispatch Terminal</text>

  <!-- Content Elements -->
  <!-- Stat Box 1 -->
  <rect x="110" y="120" width="170" height="85" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="125" y="145" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DISPATCH RESPONSE</text>
  <text x="125" y="180" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="700">7m 42s</text>

  <!-- Stat Box 2 -->
  <rect x="300" y="120" width="170" height="85" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="315" y="145" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVE DONORS GEO</text>
  <text x="315" y="180" fill="#10B981" font-family="monospace" font-size="28" font-weight="700">348</text>

  <!-- Stat Box 3 -->
  <rect x="490" y="120" width="200" height="85" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="505" y="145" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CRITICAL O- NEGATIVE</text>
  <text x="505" y="180" fill="#F87171" font-family="monospace" font-size="28" font-weight="700">MATCHED</text>

  <!-- Dispatch Table Mockup -->
  <rect x="110" y="225" width="580" height="185" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <line x1="110" y1="260" x2="690" y2="260" stroke="#334155" stroke-width="1" />
  <text x="130" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">HOSPITAL REQUEST</text>
  <text x="300" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">BLOOD GROUP</text>
  <text x="430" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">RADIUS</text>
  <text x="560" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">STATUS</text>

  <!-- Row 1 -->
  <text x="130" y="290" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">St. Mary Memorial ICU</text>
  <text x="300" y="290" fill="#EF4444" font-family="monospace" font-size="13" font-weight="700">O Negative (2 Units)</text>
  <text x="430" y="290" fill="#94A3B8" font-family="monospace" font-size="13">4.2 km</text>
  <text x="560" y="290" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Transit Confirmed</text>

  <!-- Row 2 -->
  <text x="130" y="335" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Regional Trauma Center</text>
  <text x="300" y="335" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="700">A Positive (4 Units)</text>
  <text x="430" y="335" fill="#94A3B8" font-family="monospace" font-size="13">7.8 km</text>
  <text x="560" y="335" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Donor Dispatched</text>

  <!-- Row 3 -->
  <text x="130" y="380" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Childrens Surgical Ward</text>
  <text x="300" y="380" fill="#FBBF24" font-family="monospace" font-size="13" font-weight="700">B Negative (1 Unit)</text>
  <text x="430" y="380" fill="#94A3B8" font-family="monospace" font-size="13">2.1 km</text>
  <text x="560" y="380" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Delivered</text>
</svg>